name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Typecheck, lint, unit/content/database checks, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify cross-platform test dependencies
        run: node platform/scripts/check-native-test-lock.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:content
      - run: npm run test:database
      - run: npm run build
      - run: npx --workspace platform playwright install --with-deps chromium
      - name: Public UI and route protection
        run: npm --workspace platform run e2e -- tests/e2e/public.spec.ts

  integration:
    name: Local Supabase identity and auth integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify cross-platform test dependencies
        run: node platform/scripts/check-native-test-lock.mjs
      - run: npm ci
      - run: supabase --workdir platform start
      - name: Configure isolated local test connection
        run: |
          supabase --workdir platform status --output env > "$RUNNER_TEMP/ready2work-supabase.env"
          node platform/scripts/write-ci-env.mjs "$RUNNER_TEMP/ready2work-supabase.env"
      - run: npm --workspace platform run test -- tests/integration
      - run: npx --workspace platform playwright install --with-deps chromium
      - name: Email auth, session navigation and database role access
        run: npm --workspace platform run e2e -- tests/e2e/auth.spec.ts tests/e2e/role-access.spec.ts tests/e2e/restoration.spec.ts tests/e2e/landing-session.spec.ts
      - name: Verify clean migration replay
        run: supabase --workdir platform db reset

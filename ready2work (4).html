<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready2Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1B4FE0;
  --green:#0FB88A;
  --grad: linear-gradient(120deg,#1B4FE0 0%,#0FB88A 100%);
  --ink:#0E1A33;
  --ink-soft:#556080;
  --bg:#F6F9FC;
  --card:#FFFFFF;
  --line:#E3E9F5;
  --danger:#E0475A;
  --warn:#F2A93B;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand,.btn,.step-title{font-family:'Baloo 2',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ---------- layout shells ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{font-weight:800;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav{display:flex;gap:22px;flex-wrap:wrap;}
.nav a{font-weight:600;font-size:14.5px;color:var(--ink-soft);padding:6px 2px;border-bottom:2px solid transparent;transition:.15s;}
.nav a.active,.nav a:hover{color:var(--blue);border-color:var(--green);}
.top-actions{display:flex;gap:10px;align-items:center;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:999px;border:none;font-weight:600;font-size:14.5px;
  transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(27,79,224,.55);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(27,79,224,.65);}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--blue);}
.btn-sm{padding:7px 14px;font-size:13px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.hamburger{display:none;background:none;border:none;font-size:22px;}

main{max-width:1180px;margin:0 auto;padding:36px 24px 90px;}
.page{display:none;animation:fade .35s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

footer{border-top:1px solid var(--line);margin-top:60px;padding:34px 24px 46px;text-align:center;color:var(--ink-soft);font-size:13px;}
footer .admin-link{opacity:.35;font-size:11px;color:var(--ink-soft);}
footer .admin-link:hover{opacity:.7;}

/* ---------- generic components ---------- */
.eyebrow{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--green);background:#E9FBF4;padding:5px 12px;border-radius:999px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.grid{display:grid;gap:20px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-5{grid-template-columns:1fr;}}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#EAF0FF;color:var(--blue);}
.muted{color:var(--ink-soft);}
.section-head{max-width:640px;margin-bottom:28px;}
.section-head h2{font-size:28px;margin:0 0 8px;}
hr.line{border:none;border-top:1px solid var(--line);margin:36px 0;}

/* ---------- hero ---------- */
.hero{
  background:var(--grad);border-radius:28px;color:#fff;
  padding:56px 44px;position:relative;overflow:hidden;margin-bottom:46px;
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.25),transparent 55%);}
.hero-inner{position:relative;max-width:640px;}
.hero h1{font-size:40px;line-height:1.15;margin:0 0 14px;}
.hero p{font-size:16.5px;line-height:1.6;opacity:.95;margin:0 0 26px;}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;}
.hero .btn-ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4);}
.hero .btn-white{background:#fff;color:var(--blue);}

/* ---------- stats ---------- */
.stat{text-align:center;padding:20px;}
.stat .num{font-family:'Baloo 2';font-size:30px;font-weight:800;color:var(--blue);}
.stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:4px;}

/* ---------- journey ---------- */
.journey-list{display:flex;flex-direction:column;gap:14px;}
.journey-item{
  display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;transition:.15s;cursor:pointer;
}
.journey-item:hover{border-color:var(--blue);box-shadow:0 10px 26px -16px rgba(27,79,224,.5);transform:translateY(-2px);}
.j-num{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.j-txt h4{margin:0 0 3px;font-size:16.5px;}
.j-txt p{margin:0;font-size:13.5px;color:var(--ink-soft);}
.j-arrow{margin-left:auto;color:var(--green);font-size:20px;}

/* ---------- pricing ---------- */
.price-card{position:relative;display:flex;flex-direction:column;gap:14px;}
.price-card.pop{border:2px solid var(--blue);box-shadow:0 16px 40px -20px rgba(27,79,224,.5);}
.price-card .amt{font-family:'Baloo 2';font-size:28px;font-weight:800;}
.price-card ul{padding-left:18px;margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.9;}
.popbadge{position:absolute;top:-12px;right:20px;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}

/* ---------- form ---------- */
.form-field{margin-bottom:16px;}
.form-field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
.form-field input,.form-field select,.form-field textarea{
  width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;font-family:inherit;background:#fff;
}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{outline:none;border-color:var(--blue);}
.form-box{max-width:420px;margin:0 auto;}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
.msg-err{background:#FDECEE;color:var(--danger);}
.msg-ok{background:#E9FBF4;color:#0A8F6B;}
.msg-info{background:#EAF0FF;color:var(--blue);}

/* ---------- test / quiz ---------- */
.q-block{margin-bottom:26px;}
.q-block h4{margin:0 0 12px;font-size:15.5px;}
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:14px;transition:.15s;}
.opt:hover{border-color:var(--blue);}
.opt.sel{border-color:var(--blue);background:#EAF0FF;font-weight:600;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-lbl{width:90px;font-size:13.5px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:14px;border-radius:999px;background:#EEF2FA;overflow:hidden;}
.bar-fill{height:100%;background:var(--grad);border-radius:999px;transition:width .6s ease;}
.bar-pct{width:44px;text-align:right;font-size:13px;font-weight:700;color:var(--blue);}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;}

/* ---------- task cards ---------- */
.task-card{cursor:pointer;}
.task-meta{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft);}

/* ---------- timer / workspace ---------- */
.timer-wrap{display:flex;align-items:center;justify-content:space-between;background:#0E1A33;color:#fff;border-radius:16px;padding:16px 22px;margin-bottom:20px;}
.timer-num{font-family:'Baloo 2';font-size:26px;font-weight:800;letter-spacing:.03em;}
.timer-num.low{color:#FF8A8A;}

/* ---------- chat ---------- */
.chat-window{height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:12px;}
.bubble{max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.55;}
.bubble.ai{background:#F1F5FC;align-self:flex-start;border-bottom-left-radius:4px;}
.bubble.user{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.bubble.typing{opacity:.6;font-style:italic;}
.chat-input-row{display:flex;gap:10px;margin-top:14px;}
.chat-input-row textarea{flex:1;resize:none;height:52px;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.pill{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill-pro{background:#E9FBF4;color:#0A8F6B;}
.pill-free{background:#EEF2FA;color:var(--ink-soft);}

/* ---------- admin tabs ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.tab-btn{padding:10px 18px;font-weight:700;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab-btn.active{color:var(--blue);border-color:var(--blue);}

/* ---------- update feed ---------- */
.post{border-bottom:1px solid var(--line);padding:18px 0;}
.post:last-child{border-bottom:none;}
.post h4{margin:0 0 5px;font-size:15.5px;}
.post .pdate{font-size:12px;color:var(--ink-soft);margin-top:6px;}

.center{text-align:center;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.15);border-top-color:var(--blue);animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}

@media(max-width:820px){
  .nav{display:none;}
  .hamburger{display:block;}
  .nav.open{
    display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:#fff;
    padding:16px 24px;border-bottom:1px solid var(--line);gap:14px;
  }
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .hero{padding:38px 24px;}
  .hero h1{font-size:30px;}
}
</style>
</head>

<script>
/* ============================================================
   STATE
   ============================================================ */
let session = { user: null }; // in-memory only (no cookies/localStorage in artifacts)
let adminSession = { authed:false };
let pendingSignup = null; // {name,email,plan,code}
let testAnswers = {};
let chatHistory = []; // for AI roadmap chat
let simTimer = null, ivTimer = null;

/* ---- resilient storage: uses window.storage when available, otherwise
   falls back to an in-memory store so the app always actually works ---- */
let memStorage = {};
let storageBackend = 'unknown'; // 'live' | 'memory'
async function storageSet(key, value){
  if(window.storage){
    try{ const r = await window.storage.set(key, value, true); if(r){ storageBackend='live'; return r; } }catch(e){}
  }
  storageBackend = storageBackend==='live' ? 'live' : 'memory';
  memStorage[key] = value;
  return {key, value};
}
async function storageGet(key){
  if(window.storage){
    try{ const r = await window.storage.get(key, true); if(r){ storageBackend='live'; return r; } }catch(e){}
  }
  if(key in memStorage) return {key, value: memStorage[key]};
  return null;
}
async function storageDelete(key){
  if(window.storage){
    try{ await window.storage.delete(key, true); storageBackend='live'; }catch(e){}
  }
  delete memStorage[key];
  return true;
}
async function storageList(prefix){
  let keys = [];
  if(window.storage){
    try{ const r = await window.storage.list(prefix, true); if(r && r.keys){ keys = r.keys; storageBackend='live'; } }catch(e){}
  }
  const memKeys = Object.keys(memStorage).filter(k=>k.startsWith(prefix));
  return Array.from(new Set([...keys, ...memKeys]));
}

/* ---- resilient AI call: tries the live Claude API, falls back to a
   built-in local evaluator/responder if the API isn't reachable here,
   so features never show a hard error to the user ---- */
async function callAI(prompt){
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:'user', content: prompt}] })
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    if(text) return {text, live:true};
    throw new Error('empty response');
  }catch(e){
    return {text:null, live:false};
  }
}
function localHeuristicGrade(answer, context){
  const words = (answer||'').trim().split(/\s+/).filter(Boolean);
  const len = words.length;
  let score = 30 + Math.min(55, len*2.3);
  const kw = ['vì','do đó','ví dụ','bước','đầu tiên','cuối cùng','khách hàng','dữ liệu'];
  kw.forEach(k=>{ if((answer||'').toLowerCase().includes(k)) score += 3; });
  score = Math.max(15, Math.min(96, Math.round(score)));
  let feedback;
  if(len === 0){
    feedback = `Bạn chưa nhập câu trả lời nên hệ thống chưa thể đánh giá đầy đủ. Hãy thử lại và trình bày rõ cách bạn tiếp cận vấn đề "${context}", có ví dụ hoặc số liệu cụ thể nếu có thể.`;
  } else if(len < 20){
    feedback = `Câu trả lời còn khá ngắn (${len} từ) so với yêu cầu của "${context}". Bạn nên nêu rõ các bước xử lý cụ thể và giải thích lý do lựa chọn, thay vì chỉ nêu kết luận.`;
  } else {
    feedback = `Câu trả lời cho thấy bạn có hướng tiếp cận khá rõ ràng với "${context}". Để tốt hơn, hãy bổ sung ví dụ/số liệu cụ thể và nêu rõ kết quả mong đợi sau khi thực hiện.`;
  }
  return {score, feedback};
}

function localChatFallback(){
  const lastUser = [...chatHistory].reverse().find(m=>m.role==='user');
  const msg = (lastUser?.text || '').toLowerCase();
  const hit = FIELDS.find(f => msg.includes(f.name.toLowerCase().split(' ')[0]) || msg.includes(f.id));
  const field = hit ? hit.name : (window.lastTestResult ? window.lastTestResult[0].name : null);
  if(field){
    return `Cảm ơn bạn đã chia sẻ! Với hướng ${field}, lộ trình gợi ý: (1) làm thử 1-2 bài ở mục Mô phỏng việc làm ngành ${field} để xem mình đang thiếu gì, (2) luyện 2-3 câu ở mục Luyện phỏng vấn ngành ${field}, (3) sau đó đặt lịch với 1 Mentor đang làm đúng ngành để nhận phản hồi thật. Bạn muốn bắt đầu từ bước nào trước?`;
  }
  return `Cảm ơn bạn đã chia sẻ! Để gợi ý lộ trình sát nhất, bạn có thể cho mình biết: bạn đang học ngành gì, và đang nhắm tới vị trí/công ty nào không? Trong lúc chờ, bạn có thể làm thử bài test ở mục "Khám phá nghề nghiệp" để xem ngành nào phù hợp nhất với mình.`;
}

const FIELDS = [
  {id:'ketoan', name:'Kế - Kiểm'},
  {id:'tcnh', name:'TC - NH'},
  {id:'it', name:'IT'},
  {id:'marketing', name:'Marketing'},
  {id:'logistics', name:'Logistics'}
];

const TEST_QUESTIONS = [
  {q:"Khi làm việc nhóm, bạn thường là người...", opts:[
    {t:"Kiểm tra số liệu, đảm bảo mọi thứ khớp và chính xác", f:'ketoan'},
    {t:"Tính toán rủi ro, phân tích chi phí - lợi ích", f:'tcnh'},
    {t:"Sửa lỗi kỹ thuật, tìm cách hệ thống hoạt động trơn tru", f:'it'},
    {t:"Nghĩ ý tưởng, kể câu chuyện để thuyết phục người khác", f:'marketing'},
    {t:"Sắp xếp quy trình, tối ưu đường đi/luồng công việc", f:'logistics'}
  ]},
  {q:"Môn học/chủ đề bạn thấy cuốn hút nhất là gì?", opts:[
    {t:"Kế toán, kiểm toán, thuế", f:'ketoan'},
    {t:"Tài chính doanh nghiệp, đầu tư, ngân hàng", f:'tcnh'},
    {t:"Lập trình, dữ liệu, công nghệ", f:'it'},
    {t:"Truyền thông, sáng tạo nội dung, hành vi khách hàng", f:'marketing'},
    {t:"Vận hành chuỗi cung ứng, kho vận", f:'logistics'}
  ]},
  {q:"Bạn thích một ngày làm việc như thế nào?", opts:[
    {t:"Rõ ràng, có quy trình, độ chính xác cao", f:'ketoan'},
    {t:"Phân tích số liệu để ra quyết định lớn", f:'tcnh'},
    {t:"Giải một bài toán logic khó, thấy kết quả ngay", f:'it'},
    {t:"Tạo ra thứ mới, được phản hồi từ nhiều người", f:'marketing'},
    {t:"Phối hợp nhiều bên để mọi thứ vận hành đúng giờ", f:'logistics'}
  ]},
  {q:"Bạn tự tin nhất ở kỹ năng nào?", opts:[
    {t:"Cẩn thận, tỉ mỉ với con số", f:'ketoan'},
    {t:"Đọc hiểu báo cáo tài chính, dự báo xu hướng", f:'tcnh'},
    {t:"Tư duy logic, debug vấn đề", f:'it'},
    {t:"Viết lách, thiết kế, kể chuyện thương hiệu", f:'marketing'},
    {t:"Lập kế hoạch, quản lý thời gian nhiều đầu việc", f:'logistics'}
  ]},
  {q:"Nếu được thực tập 1 tháng miễn phí, bạn chọn phòng ban nào?", opts:[
    {t:"Phòng Kế toán - Kiểm toán", f:'ketoan'},
    {t:"Phòng Tài chính - Đầu tư", f:'tcnh'},
    {t:"Phòng Công nghệ thông tin", f:'it'},
    {t:"Phòng Marketing - Truyền thông", f:'marketing'},
    {t:"Phòng Vận hành - Logistics", f:'logistics'}
  ]}
];

const DEFAULT_SIM_TASKS = {

/* ---- dynamic content: admin-managed collections, seeded from the
   defaults above the first time they're read, then fully editable ---- */
let simTasksCache = [];
let ivQuestionsCache = [];
let mentorsCache = [];

async function collectionItems(prefix){
  const keys = await storageList(prefix);
  const items = await Promise.all(keys.map(async k=>{
    try{ const r = await storageGet(k); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }));
  return items.filter(Boolean);
}
async function getSimTasks(force){
  if(!force && simTasksCache.length) return simTasksCache;
  let items = await collectionItems('simtask:');
  if(items.length === 0){
    for(const [fid, tasks] of Object.entries(DEFAULT_SIM_TASKS)){
      for(const t of tasks){ await storageSet('simtask:'+t.id, JSON.stringify({...t, field:fid})); }
    }
    items = await collectionItems('simtask:');
  }
  simTasksCache = items;
  return items;
}
async function getIvQuestions(force){
  if(!force && ivQuestionsCache.length) return ivQuestionsCache;
  let items = await collectionItems('ivq:');
  if(items.length === 0){
    for(const [fid, qs] of Object.entries(DEFAULT_IV_QUESTIONS)){
      for(const q of qs){ await storageSet('ivq:'+q.id, JSON.stringify({...q, field:fid})); }
    }
    items = await collectionItems('ivq:');
  }
  ivQuestionsCache = items;
  return items;
}
async function getMentors(force){
  if(!force && mentorsCache.length) return mentorsCache;
  let items = await collectionItems('mentor:');
  if(items.length === 0){
    for(const m of DEFAULT_MENTORS){ await storageSet('mentor:'+m.id, JSON.stringify(m)); }
    items = await collectionItems('mentor:');
  }
  mentorsCache = items;
  return items;
}
function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function fmtTime(s){ const m=Math.floor(s/60), r=s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; }
function startCountdown(elId, seconds, onEnd){
  clearInterval(simTimer); clearInterval(ivTimer);
  let left = seconds;
  const el = document.getElementById(elId);
  const tick = ()=>{
    if(!document.getElementById(elId)) return clearInterval(timerRef);
    left--;
    if(el){ el.textContent = fmtTime(Math.max(left,0)); el.classList.toggle('low', left<=30); }
    if(left<=0){ clearInterval(timerRef); onEnd && onEnd(); }
  };
  const timerRef = setInterval(tick, 1000);
  if(elId==='simCountdown') simTimer = timerRef; else ivTimer = timerRef;
}

    const result = await storageSet('users:'+email, JSON.stringify(userRecord));

      throw new Error('write failed');
    }
    session.user = userRecord;
    pendingSignup = null;
    navigate('/tai-khoan');
    render();
  }catch(e){
    msgs.innerHTML = `<div class="msg msg-err">Không thể tạo tài khoản lúc này (lỗi lưu trữ). Vui lòng thử lại.</div>`;
    btn.disabled = false; btn.textContent = 'Xác nhận & tạo tài khoản';
  }
}

/* ============================================================
   LOGIN / ACCOUNT
   ============================================================ */
function renderLogin(main){
  main.innerHTML = `
    <div class="section-head center" style="margin:0 auto 28px;"><h2>Đăng nhập</h2><p class="muted">Dùng email bạn đã đăng ký ở trang Bảng giá.</p></div>
    <div class="card form-box">
      <div id="loginMsgs"></div>
      <div class="form-field"><label>Email</label><input id="loginEmail" type="email" placeholder="ban@email.com"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Đăng nhập</button>
      <p class="muted center" style="margin-top:16px;font-size:13px;">Chưa có tài khoản? <a href="#/bang-gia" style="color:var(--blue);font-weight:600;">Đăng ký ở đây</a></p>
    </div>
  `;
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const msgs = document.getElementById('loginMsgs');
  if(!email){ msgs.innerHTML = `<div class="msg msg-err">Vui lòng nhập email.</div>`; return; }
  try{
    const res = await storageGet('users:'+email);
    if(!res){ throw new Error('not found'); }
    session.user = JSON.parse(res.value);
    navigate('/tai-khoan'); render();
  }catch(e){
    msgs.innerHTML = `<div class="msg msg-err">Không tìm thấy tài khoản với email này. Bạn đã đăng ký chưa?</div>`;
  }
}
function logout(){ session.user = null; navigate('/'); render(); }
function renderAccount(main){
  if(!session.user){
    main.innerHTML = `<div class="empty"><h2>Bạn chưa đăng nhập</h2><p class="muted">Đăng nhập để xem thông tin tài khoản.</p><a class="btn btn-primary" href="#/dang-nhap">Đăng nhập</a></div>`;
    return;
  }
  const u = session.user;
  main.innerHTML = `
    <div class="section-head"><span class="eyebrow">Tài khoản</span><h2>Xin chào, ${escapeHtml(u.name)}</h2></div>
    <div class="card" style="max-width:520px;">
      <table>
        <tr><th>Email</th><td>${escapeHtml(u.email)}</td></tr>
        <tr><th>Gói hiện tại</th><td><span class="pill ${u.plan==='pro'?'pill-pro':'pill-free'}">${u.plan.toUpperCase()}</span></td></tr>
        <tr><th>Ngày đăng ký</th><td>${u.date}</td></tr>
      </table>
      <button class="btn btn-ghost" style="margin-top:18px;" onclick="logout()">Đăng xuất</button>
    </div>
  `;
}

/* ============================================================
   UPDATES FEED
   ============================================================ */
async function renderUpdates(main){
  main.innerHTML = `
    <div class="section-head"><span class="eyebrow">Bảng tin</span><h2>Cập nhật mới nhất</h2></div>
    <div class="card" id="updatesList"><div class="center muted"><span class="spinner"></span> Đang tải...</div></div>
  `;
  const posts = await listPosts();
  const el = document.getElementById('updatesList');
  if(!el) return;
  el.innerHTML = posts.length ? posts.map(p=>`
    <div class="post"><span class="tag">${escapeHtml(p.tag)}</span><h4>${escapeHtml(p.title)}</h4><p class="muted">${escapeHtml(p.content)}</p><div class="pdate">${p.date}</div></div>
  `).join('') : `<p class="muted">Chưa có bài cập nhật nào.</p>`;
}
async function listPosts(){
  try{
    const keys = await storageList('posts:');
    const items = await Promise.all(keys.map(async k=>{
      try{ const r = await storageGet(k); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
    }));
    return items.filter(Boolean).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  }catch(e){ return []; }
}

/* ============================================================
   ADMIN PORTAL (hidden route, not linked in nav)
   ============================================================ */
function renderAdmin(main){
  if(!adminSession.authed){
    main.innerHTML = `
      <div class="section-head center" style="margin:0 auto 28px;"><h2>Quản trị hệ thống</h2><p class="muted">Khu vực nội bộ — chỉ dành cho quản trị viên.</p></div>
      <div class="card form-box">
        <div id="adminLoginMsg"></div>
        <div class="form-field"><label>Mật khẩu quản trị</label><input id="adminPw" type="password" placeholder="••••••••"></div>
        <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Đăng nhập quản trị</button>
      </div>
    `;
    return;
  }
  main.innerHTML = `
    <div class="section-head"><span class="eyebrow">Quản trị</span><h2>Bảng điều khiển Ready2Work</h2></div>
    <div class="tabs">
      <button class="tab-btn active" data-t="overview" onclick="setAdminTab('overview')">Tổng quan</button>
      <button class="tab-btn" data-t="users" onclick="setAdminTab('users')">Người dùng</button>
      <button class="tab-btn" data-t="content" onclick="setAdminTab('content')">Nội dung</button>
    </div>
    <div id="adminTabBody"></div>
  `;
  setAdminTab('overview');
}
function adminLogin(){
  const pw = document.getElementById('adminPw').value;
  if(pw === 'ready2work'){
    adminSession.authed = true;
    renderAdmin(document.getElementById('mainContent'));
  } else {
    document.getElementById('adminLoginMsg').innerHTML = `<div class="msg msg-err">Sai mật khẩu.</div>`;
  }
}
let adminTab = 'overview';
let adminAutoRefresh = null;
function setAdminTab(t){
  adminTab = t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  clearInterval(adminAutoRefresh);
  if(t==='overview') loadAdminOverview();
  if(t==='users') loadAdminUsers();
  if(t==='content') loadAdminContent();
  if(t==='overview' || t==='users'){
    adminAutoRefresh = setInterval(()=>{ if(t==='overview') loadAdminOverview(); if(t==='users') loadAdminUsers(); }, 5000);
  }
}
async function fetchAllUsers(){
  try{
    const keys = await storageList('users:');
    const items = await Promise.all(keys.map(async k=>{
      try{ const r = await storageGet(k); return r ? {key:k, ...JSON.parse(r.value)} : null; }catch(e){ return null; }
    }));
    return items.filter(Boolean);
  }catch(e){ return []; }
}
async function loadAdminOverview(){
  const body = document.getElementById('adminTabBody');
  if(!body) return;
  body.innerHTML = `<div class="center muted"><span class="spinner"></span> Đang tải...</div>`;
  const users = await fetchAllUsers();
  const posts = await listPosts();
  const pro = users.filter(u=>u.plan==='pro').length;
  const free = users.filter(u=>u.plan==='free').length;
  const b2b = users.filter(u=>u.plan==='b2b').length;
  if(document.getElementById('adminTabBody') !== body || adminTab!=='overview') return;
  body.innerHTML = `
    <div class="grid grid-3">
      <div class="card stat"><div class="num">${users.length}</div><div class="lbl">Tổng người dùng đã đăng ký</div></div>
      <div class="card stat"><div class="num">${pro}</div><div class="lbl">Đang dùng gói Pro</div></div>
      <div class="card stat"><div class="num">${posts.length}</div><div class="lbl">Bài đăng trên bảng tin</div></div>
    </div>
    <div class="grid grid-3" style="margin-top:20px;">
      <div class="card stat"><div class="num">${free}</div><div class="lbl">Gói Free</div></div>
      <div class="card stat"><div class="num">${b2b}</div><div class="lbl">Gói B2B</div></div>
      <div class="card stat"><div class="num">${new Date().toLocaleTimeString('vi-VN')}</div><div class="lbl">Tự động làm mới mỗi 5 giây</div></div>
    </div>
  `;
}
async function loadAdminUsers(){
  const body = document.getElementById('adminTabBody');
  if(!body) return;
  body.innerHTML = `<div class="center muted"><span class="spinner"></span> Đang tải...</div>`;
  const users = await fetchAllUsers();
  if(document.getElementById('adminTabBody') !== body || adminTab!=='users') return;
  body.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-ghost btn-sm" onclick="loadAdminUsers()">↻ Làm mới</button></div>
    <div class="card">
      ${users.length===0 ? `<p class="muted">Chưa có người dùng nào đăng ký.</p>` : `
      <table>
        <tr><th>Tên</th><th>Email</th><th>Gói</th><th>Ngày đăng ký</th><th></th></tr>
        ${users.map(u=>`
          <tr>
            <td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td>
            <td><span class="pill ${u.plan==='pro'?'pill-pro':'pill-free'}">${u.plan.toUpperCase()}</span></td>
            <td>${u.date}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteUser('${u.key}')">Xoá</button></td>
          </tr>`).join('')}
      </table>`}
    </div>
  `;
}
async function deleteUser(key){
  if(!confirm('Xoá người dùng này?')) return;
  try{ await storageDelete(key); }catch(e){}
  loadAdminUsers();
}
async function loadAdminContent(){
  const body = document.getElementById('adminTabBody');
  if(!body) return;
  const posts = await listPosts();
  body.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <h4 style="margin-top:0;">Đăng bài mới</h4>
        <div id="postMsg"></div>
        <div class="form-field"><label>Tag</label><input id="postTag" placeholder="Ví dụ: Mentor mới, Cập nhật tính năng..."></div>
        <div class="form-field"><label>Tiêu đề</label><input id="postTitle" placeholder="Tiêu đề bài đăng"></div>
        <div class="form-field"><label>Nội dung</label><textarea id="postContent" rows="4" placeholder="Nội dung..."></textarea></div>
        <button class="btn btn-primary" onclick="createPost()">Đăng bài</button>
      </div>
      <div class="card">
        <h4 style="margin-top:0;">Bài đã đăng (${posts.length})</h4>
        <div style="max-height:420px;overflow-y:auto;">
          ${posts.length===0 ? `<p class="muted">Chưa có bài nào.</p>` : posts.map(p=>`
            <div class="post">
              <span class="tag">${escapeHtml(p.tag)}</span>
              <h4>${escapeHtml(p.title)}</h4>
              <p class="muted" style="font-size:13px;">${escapeHtml(p.content)}</p>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="pdate">${p.date}</span>
                <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')">Xoá</button>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}
async function createPost(){
  const tag = document.getElementById('postTag').value.trim();
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  const msg = document.getElementById('postMsg');
  if(!tag || !title || !content){ msg.innerHTML = `<div class="msg msg-err">Vui lòng nhập đủ Tag, Tiêu đề và Nội dung.</div>`; return; }
  const id = 'p'+Date.now();
  const record = { id, tag, title, content, date: new Date().toISOString().slice(0,10) };
  try{
    const res = await storageSet('posts:'+id, JSON.stringify(record));
    if(!res) throw new Error('failed');
    loadAdminContent();
  }catch(e){
    msg.innerHTML = `<div class="msg msg-err">Không thể đăng bài (lỗi lưu trữ). Thử lại nhé.</div>`;
  }
}
async function deletePost(id){
  if(!confirm('Xoá bài đăng này?')) return;
  try{ await storageDelete('posts:'+id); }catch(e){}
  loadAdminContent();
}
</script>
</body>
</html>
